[package]
name = "cifrasync"
version = "0.5.0"
description = "CifraSync — cifras, repertórios e teleprompter de palco"
authors = ["arthurjosebona"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "cifrasync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
keepawake = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
