name: Release

# Ao enviar uma tag vX.Y.Z (criada no merge da release na main), cria a GitHub Release com as
# notas do CHANGELOG e anexa os instaladores. Pelo workflow_dispatch, gera os mesmos artefatos
# como teste, sem publicar Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: criar release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Notas da versão a partir do CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versão $version." > notas.md

      - name: Criar a release (se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "CifraSync $GITHUB_REF_NAME" --notes-file notas.md --verify-tag

  desktop:
    name: desktop (${{ matrix.os }})
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configuração do build
        id: cfg
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          # sem a chave do updater (ex.: build de teste antes da T65), gera os instaladores sem o latest.json
          if [ "$HAS_KEY" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo 'args=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_OUTPUT"
          fi

      - name: Build e publicação dos instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ steps.cfg.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('CifraSync {0}', github.ref_name) || '' }}
          includeUpdaterJson: true

      - name: Guardar instaladores (build de teste)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: android (APK)
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build da SPA para os apps nativos
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm turbo run build --filter=@cifrasync/web^... && pnpm --filter @cifrasync/web build:native

      - name: Sincronizar o projeto Android
        run: pnpm --filter @cifrasync/android exec cap sync android

      - name: Versão a partir do package.json
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Keystore de assinatura
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cifrasync.jks"
            echo "path=$RUNNER_TEMP/cifrasync.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem keystore (T71): gerando APK de debug, que não serve para publicar."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Gradle
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          task=assembleRelease
          [ -z "$ANDROID_KEYSTORE_PATH" ] && task=assembleDebug
          ./gradlew "$task" --no-daemon \
            -PcifrasyncVersionName=${{ steps.ver.outputs.name }} \
            -PcifrasyncVersionCode=${{ steps.ver.outputs.code }}
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$apk" "$GITHUB_WORKSPACE/cifrasync-${{ steps.ver.outputs.name }}.apk"

      - name: Anexar o APK à release
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "cifrasync-${{ steps.ver.outputs.name }}.apk" --clobber

      - name: Guardar o APK (build de teste)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || steps.ks.outputs.path == '' }}
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: cifrasync-*.apk
          retention-days: 14
